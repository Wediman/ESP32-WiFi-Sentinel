<text x="42" y="391" fill="#111">11  D4</text>
<line x1="210" y1="386" x2="380" y2="386" stroke="#1a5fd0" stroke-width="3"/>
<circle cx="210" cy="386" r="4" fill="#1a5fd0"/>
<text x="42" y="429" fill="#111">12  D5</text>
