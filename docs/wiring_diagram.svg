<circle cx="210" cy="462" r="4" fill="#1a5fd0"/>
<text x="42" y="505" fill="#111">14  D7</text>
<line x1="210" y1="500" x2="380" y2="500" stroke="#1a5fd0" stroke-width="3"/>
<circle cx="210" cy="500" r="4" fill="#1a5fd0"/>
<text x="42" y="543" fill="#111">15  A (backlight +)</text>
<line x1="210" y1="538" x2="290" y2="538" stroke="#cc2222" stroke-width="3"/>
<circle cx="210" cy="538" r="4" fill="#cc2222"/>
<text x="296" y="543" fill="#cc2222" font-weight="bold">5V (+ resistor if needed)</text>
<text x="42" y="581" fill="#111">16  K (backlight -)</text>
<line x1="210" y1="576" x2="290" y2="576" stroke="#222222" stroke-width="3"/>
<circle cx="210" cy="576" r="4" fill="#222222"/>
<text x="296" y="581" fill="#222222" font-weight="bold">GND</text>
<rect x="380" y="190" width="140" height="340" rx="8" fill="#fff6e0" stroke="#334" stroke-width="2"/>
<text x="450" y="214" text-anchor="middle" font-weight="bold" fill="#111">ESP32-WROOM</text>
<circle cx="380" cy="234" r="4" fill="#1a5fd0"/>
<text x="392" y="239" fill="#111">GPIO21</text>
<circle cx="380" cy="310" r="4" fill="#1a5fd0"/>
<text x="392" y="315" fill="#111">GPIO22</text>
<circle cx="380" cy="386" r="4" fill="#1a5fd0"/>
<text x="392" y="391" fill="#111">GPIO18</text>
<circle cx="380" cy="424" r="4" fill="#1a5fd0"/>
<text x="392" y="429" fill="#111">GPIO19</text>
<circle cx="380" cy="462" r="4" fill="#1a5fd0"/>
<text x="392" y="467" fill="#111">GPIO23</text>
<circle cx="380" cy="500" r="4" fill="#1a5fd0"/>
<text x="392" y="505" fill="#111">GPIO25</text>
<rect x="700" y="190" width="170" height="230" rx="8" fill="#eaf7ea" stroke="#334" stroke-width="2"/>
<text x="785" y="214" text-anchor="middle" font-weight="bold" fill="#111">Joystick module</text>
<line x1="520" y1="234" x2="700" y2="234" stroke="#cc2222" stroke-width="3"/>
<circle cx="520" cy="234" r="4" fill="#cc2222"/>
<circle cx="700" cy="234" r="4" fill="#cc2222"/>
<text x="508" y="239" text-anchor="end" fill="#111">3V3</text>
<text x="712" y="239" fill="#111" font-size="13">VCC</text>
<line x1="520" y1="272" x2="700" y2="272" stroke="#222222" stroke-width="3"/>
<circle cx="520" cy="272" r="4" fill="#222222"/>
<circle cx="700" cy="272" r="4" fill="#222222"/>
<text x="508" y="277" text-anchor="end" fill="#111">GND</text>
<text x="712" y="277" fill="#111" font-size="13">GND</text>
<line x1="520" y1="310" x2="700" y2="310" stroke="#1a5fd0" stroke-width="3"/>
<circle cx="520" cy="310" r="4" fill="#1a5fd0"/>
<circle cx="700" cy="310" r="4" fill="#1a5fd0"/>
<text x="508" y="315" text-anchor="end" fill="#111">GPIO35</text>
<text x="712" y="315" fill="#111" font-size="13">VRX (left/right)</text>
<line x1="520" y1="348" x2="700" y2="348" stroke="#1a5fd0" stroke-width="3"/>
<circle cx="520" cy="348" r="4" fill="#1a5fd0"/>
<circle cx="700" cy="348" r="4" fill="#1a5fd0"/>
<text x="508" y="353" text-anchor="end" fill="#111">GPIO34</text>
<text x="712" y="353" fill="#111" font-size="13">VRY (up/down)</text>
<line x1="520" y1="386" x2="700" y2="386" stroke="#1a5fd0" stroke-width="3"/>
<circle cx="520" cy="386" r="4" fill="#1a5fd0"/>
<circle cx="700" cy="386" r="4" fill="#1a5fd0"/>
<text x="508" y="391" text-anchor="end" fill="#111">GPIO32</text>
<text x="712" y="391" fill="#111" font-size="13">SW (button)</text>
<rect x="540" y="450" width="340" height="205" rx="8" fill="#f7f7f7" stroke="#999"/>
<text x="556" y="474" font-weight="bold" fill="#111">Legend and notes</text>
<line x1="556" y1="490" x2="590" y2="490" stroke="#1a5fd0" stroke-width="3"/><text x="598" y="495" fill="#111">Signal wire</text>
<line x1="556" y1="512" x2="590" y2="512" stroke="#cc2222" stroke-width="3"/><text x="598" y="517" fill="#111">Power wire</text>
<line x1="556" y1="534" x2="590" y2="534" stroke="#222222" stroke-width="3"/><text x="598" y="539" fill="#111">Ground (GND) wire</text>
<text x="556" y="562" fill="#111" font-size="13">5V rail: ESP32 VIN pin to LCD pins 2 and 15</text>
<text x="556" y="578" fill="#111" font-size="13">GND rail: ESP32 GND to LCD pins 1, 5, 16 + joystick</text>
<text x="556" y="594" fill="#111" font-size="13">Joystick VCC = 3V3 ONLY (never 5V)</text>
<text x="556" y="610" fill="#111" font-size="13">Contrast: 10k pot, outer pins on 5V and GND,</text>
<text x="556" y="626" fill="#111" font-size="13">middle pin to LCD V0 (pin 3)</text>
<text x="556" y="642" fill="#111" font-size="13">Power the ESP32 through its USB port</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>