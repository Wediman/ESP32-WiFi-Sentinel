<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Arial, Helvetica, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="900" height="680" fill="#ffffff"/>
<text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">ESP32 Wi-Fi Scanner - Wiring Diagram</text>
<rect x="30" y="60" width="180" height="540" rx="8" fill="#eef4ff" stroke="#334" stroke-width="2"/>
<text x="120" y="84" text-anchor="middle" font-weight="bold" fill="#111">LCD1602 (non-I2C)</text>
<text x="42" y="125" fill="#111">1  VSS</text>
<line x1="210" y1="120" x2="290" y2="120" stroke="#222222" stroke-width="3"/>
<circle cx="210" cy="120" r="4" fill="#222222"/>
<text x="296" y="125" fill="#222222" font-weight="bold">GND</text>
<text x="42" y="163" fill="#111">2  VDD</text>
<line x1="210" y1="158" x2="290" y2="158" stroke="#cc2222" stroke-width="3"/>
<circle cx="210" cy="158" r="4" fill="#cc2222"/>
<text x="296" y="163" fill="#cc2222" font-weight="bold">5V</text>
<text x="42" y="201" fill="#111">3  V0</text>
<line x1="210" y1="196" x2="290" y2="196" stroke="#777777" stroke-width="3"/>
<circle cx="210" cy="196" r="4" fill="#777777"/>
<text x="296" y="201" fill="#777777" font-weight="bold">10k pot middle pin</text>
<text x="42" y="239" fill="#111">4  RS</text>
<line x1="210" y1="234" x2="380" y2="234" stroke="#1a5fd0" stroke-width="3"/>
<circle cx="210" cy="234" r="4" fill="#1a5fd0"/>
